<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>検索結果</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='results.css') }}">
</head>
<body>
    <h1>検索結果: {{ keyword }}</h1>

    {% for result in results %}
    <section>
        <h2>{{ result.title }}</h2>
        <p><strong>リンク:</strong> <a href="{{ result.link }}" target="_blank">{{ result.link }}</a></p>
        <div class="content">
            <p><strong>本文の文字数:</strong> {{ result.text_length }} 文字</p>
            <p><strong>h2タグ:</strong></p>
            <ul>
                {% for h2 in result.h2_tags %}
                    <li>{{ h2 }}</li>
                {% endfor %}
            </ul>
        </div>
    </section>
    {% endfor %}
</body>
</html>
